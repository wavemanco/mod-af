<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="dynamics">
<title>@@TITLE@@</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a drafting sheet. The stock-and-flow drawing is the page; a narrow rail reads it back. Stacks on phones. */
:root {
  --paper: #eceff0; --sheet: #f8faf9; --ink: #1b2328; --ink-soft: #57646a; --line: #75838a;
  --grid: #e2e7e8; --grid-major: #d5dcde; --rule: #cdd5d8;
  --reinf: #a8570c; --reinf-wash: #f4e6d6; --bal: #0a6b63; --bal-wash: #d7ebe8; --focus: #2b55c0;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1315; --sheet: #141b1e; --ink: #dee6e4; --ink-soft: #9ba9ab; --line: #7f8e90;
    --grid: #1a2326; --grid-major: #212c30; --rule: #2b383c;
    --reinf: #e59b46; --reinf-wash: #3a2a17; --bal: #47b9a9; --bal-wash: #163430; --focus: #8eadff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1315; --sheet: #141b1e; --ink: #dee6e4; --ink-soft: #9ba9ab; --line: #7f8e90;
  --grid: #1a2326; --grid-major: #212c30; --rule: #2b383c;
  --reinf: #e59b46; --reinf-wash: #3a2a17; --bal: #47b9a9; --bal-wash: #163430; --focus: #8eadff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--body); margin: 0; }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 40px; display: grid; gap: 18px; }
.masthead { display: grid; gap: 6px; max-width: 78ch; }
.eyebrow { font: 500 11.5px/1.3 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 0; }
h1 { font: 700 clamp(30px, 4.2vw, 46px)/1.02 var(--display); letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.lede { margin: 4px 0 0; color: var(--ink-soft); max-width: 70ch; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding-block: 10px; }
.controls .label { font: 500 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); }
.stage-controls { display: contents; }
.stage-controls[hidden] { display: none; }
.stages { display: flex; flex-wrap: wrap; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--sheet); }
.stage-btn { font: 500 13px var(--mono); padding: 6px 11px; border: 0; border-right: 1px solid var(--rule); background: transparent; color: var(--ink-soft); cursor: pointer; }
.stage-btn:last-child { border-right: 0; }
.stage-btn[aria-checked="true"] { background: var(--ink); color: var(--sheet); }
.stage-btn:hover:not([aria-checked="true"]) { color: var(--ink); background: var(--grid); }
.toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; color: var(--ink-soft); cursor: pointer; }
.toggle input { accent-color: var(--ink); width: 15px; height: 15px; }
.ghost-btn { font: 500 13px var(--body); padding: 6px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); color: var(--ink); cursor: pointer; }
.ghost-btn:hover { border-color: var(--line); }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.stage-note { margin: 0; font-size: 14px; color: var(--ink); max-width: 110ch; }
.stage-note .count { display: inline-block; margin-left: 8px; font: 500 12px var(--mono); color: var(--ink-soft); }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
@media (max-width: 1020px) { .main { grid-template-columns: minmax(0, 1fr); } }
figure { margin: 0; min-width: 0; display: grid; gap: 10px; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; overflow-x: auto; }
#sd { display: block; width: 100%; min-width: @@MINWIDTH@@px; height: auto; color: var(--ink); }
figcaption { font-size: 13.5px; color: var(--ink-soft); max-width: 95ch; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.gridline.major { stroke: var(--grid-major); }
.stock-box { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.6; }
.stock-label { font: 600 13px var(--body); fill: var(--ink); }
.var-label { font: 500 12.5px var(--body); fill: var(--ink); }
.var-label.parameter { font: italic 500 12px var(--mono); fill: var(--ink-soft); }
.var-label.exogenous { font-weight: 600; }
.exo-pill { fill: var(--sheet); stroke: var(--ink-soft); stroke-width: 1.2; stroke-dasharray: 3 3; }
.decision-box { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.2; }
.cloud { fill: var(--sheet); stroke: var(--ink-soft); stroke-width: 1.2; }
.cloud-base { fill: var(--sheet); stroke: none; }
.pipe { stroke: var(--ink); stroke-width: 1.5; }
.pipe-head { fill: var(--ink); }
.valve { fill: var(--sheet); stroke: var(--ink); stroke-width: 1.3; stroke-linejoin: round; }
.flow-label { font: 500 11.5px var(--body); fill: var(--ink-soft); }
.link-path { fill: none; stroke: var(--line); stroke-width: 1.25; }
.link.hypothesis .link-path { stroke-dasharray: 5 4; }
.arrowhead { fill: var(--line); }
.arrowhead.R { fill: var(--reinf); } .arrowhead.B { fill: var(--bal); } .arrowhead.focus { fill: var(--ink); }
.pol-bg { fill: var(--sheet); }
.pol { font: 700 13px var(--mono); fill: var(--ink); }
.delay { stroke: var(--ink); stroke-width: 1.6; }
.loop-arc { fill: none; stroke-width: 2; }
.type-R .loop-arc { stroke: var(--reinf); } .type-B .loop-arc { stroke: var(--bal); }
.loop-id { font: 700 12px var(--mono); }
.type-R .loop-id { fill: var(--reinf); } .type-B .loop-id { fill: var(--bal); }
.loop-name { font: 600 11px var(--body); fill: var(--ink-soft); }
.stock-label, .var-label, .flow-label, .loop-name, .loop-id { paint-order: stroke; stroke: var(--sheet); stroke-width: 4px; stroke-linejoin: round; }
.node, .flow, .loop-mark { cursor: pointer; }
.node:hover .stock-box, .node:focus-visible .stock-box { stroke-width: 2.4; }
.node:hover .var-label, .flow:hover .flow-label, .loop-mark:hover .loop-name { fill: var(--ink); }
g { transition: opacity .18s ease; }
.is-future { opacity: .17; }
.is-future .stock-box, .is-future .decision-box { stroke-dasharray: 4 3; }
.is-hidden { opacity: 0; pointer-events: none; }
.is-dim { opacity: .14; }
.is-future.is-hot { opacity: .55; }
.link.is-hot .link-path { stroke: var(--ink); stroke-width: 2; }
.link.loop-R .link-path { stroke: var(--reinf); stroke-width: 2.4; }
.link.loop-B .link-path { stroke: var(--bal); stroke-width: 2.4; }
.node.loop-R .stock-box, .node.loop-R .decision-box { stroke: var(--reinf); stroke-width: 2.4; fill: var(--reinf-wash); }
.node.loop-B .stock-box, .node.loop-B .decision-box { stroke: var(--bal); stroke-width: 2.4; fill: var(--bal-wash); }
.node.loop-R .var-label { fill: var(--reinf); } .node.loop-B .var-label { fill: var(--bal); }
.flow.loop-R .pipe, .flow.loop-R .valve { stroke: var(--reinf); } .flow.loop-R .pipe-head { fill: var(--reinf); }
.flow.loop-B .pipe, .flow.loop-B .valve { stroke: var(--bal); } .flow.loop-B .pipe-head { fill: var(--bal); }
.loop-mark.is-hot .loop-arc { stroke-width: 3; }
@media (prefers-reduced-motion: reduce) { g { transition: none; } }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 12.5px; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend svg { width: 34px; height: 18px; color: var(--ink); overflow: visible; }
aside { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; padding: 16px 18px; min-height: 220px; }
.panel h2 { font: 700 22px/1.15 var(--display); margin: 2px 0 8px; letter-spacing: -.01em; text-wrap: balance; }
.panel h3 { font: 500 11.5px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-soft); margin: 14px 0 6px; }
.panel p { margin: 0 0 10px; }
.panel ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.panel ul.plain, .panel ul.links { list-style: none; padding: 0; }
.panel .c-r { color: var(--reinf); } .panel .c-b { color: var(--bal); }
.panel .chain { font-size: 13.5px; color: var(--ink-soft); line-height: 1.7; }
.panel .arr { color: var(--line); padding: 0 2px; }
.panel .meta { font-size: 13px; color: var(--ink-soft); }
.panel .meta span { display: block; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
.panel ul.links li { font-size: 13.5px; }
.panel ul.links small { color: var(--ink-soft); font-size: 12.5px; }
.pol-chip { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); font: 700 12px var(--mono); margin-right: 4px; }
.tag { font: 500 11px var(--mono); border: 1px solid var(--rule); border-radius: 3px; padding: 1px 5px; margin-left: 6px; color: var(--ink); text-transform: none; letter-spacing: 0; }
.tag-future { color: var(--ink-soft); border-style: dashed; }
.chips { display: grid; gap: 6px; }
.chip { display: flex; align-items: center; gap: 10px; text-align: left; font: 500 14px var(--body); padding: 7px 10px; border: 1px solid var(--rule); border-radius: 4px; background: var(--sheet); color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--line); }
.chip-id { font: 700 12px var(--mono); min-width: 24px; }
.chip-R .chip-id { color: var(--reinf); } .chip-B .chip-id { color: var(--bal); }
.chip[aria-pressed="true"].chip-R { background: var(--reinf-wash); border-color: var(--reinf); }
.chip[aria-pressed="true"].chip-B { background: var(--bal-wash); border-color: var(--bal); }
.chip.is-future { opacity: .5; }
.foot { font-size: 12.5px; color: var(--ink-soft); border-top: 1px solid var(--rule); padding-top: 12px; max-width: 110ch; }
</style>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">@@EYEBROW@@</p>
    <h1>@@TITLE@@</h1>
    <p class="lede">@@LEDE@@</p>
  </header>

  <div class="controls">
    <span class="stage-controls" id="stage-controls">
      <span class="label" id="stage-label">Stage</span>
      <span class="stages" id="stages" role="radiogroup" aria-labelledby="stage-label"></span>
      <label class="toggle" for="ghost"><input type="checkbox" id="ghost" checked> Show later stages faintly</label>
    </span>
    <button type="button" class="ghost-btn" id="clear">Clear highlight</button>
  </div>
  <p class="stage-note" id="stage-note" aria-live="polite"></p>

  <div class="main">
    <figure>
      <div class="sheet">
        <svg id="sd" viewBox="@@VIEWBOX@@" role="img" aria-label="@@ARIA@@">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead"/></marker>
            <marker id="arrow-R" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead R"/></marker>
            <marker id="arrow-B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead B"/></marker>
            <marker id="arrow-focus" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="arrowhead focus"/></marker>
          </defs>
        </svg>
      </div>
      <div class="legend" aria-label="Legend">
        <span><svg viewBox="0 0 34 18" aria-hidden="true"><rect x="2" y="3" width="30" height="12" class="stock-box"/></svg>Stock (accumulates)</span>
        <span><svg viewBox="0 0 34 18" aria-hidden="true"><line x1="1" y1="6" x2="27" y2="6" class="pipe"/><line x1="1" y1="12" x2="27" y2="12" class="pipe"/><polygon points="33,9 26,3 26,15" class="pipe-head"/><polygon points="9,2 17,2 9,16 17,16" class="valve"/></svg>Flow with valve</span>
        <span><svg viewBox="0 0 34 18" aria-hidden="true"><circle cx="11" cy="10" r="6" class="cloud"/><circle cx="18" cy="7" r="7" class="cloud"/><circle cx="25" cy="10" r="6" class="cloud"/></svg>Outside the system</span>
        <span><svg viewBox="0 0 34 18" aria-hidden="true"><path d="M2,14 Q17,0 30,10" class="link-path" marker-end="url(#arrow)"/></svg><b>+</b> moves together &middot; <b>&minus;</b> moves opposite</span>
        <span><svg viewBox="0 0 34 18" aria-hidden="true"><path d="M2,14 Q17,0 30,10" class="link-path" style="stroke-dasharray:5 4" marker-end="url(#arrow)"/></svg>Hypothesis (not in the sources)</span>
        <span><svg viewBox="0 0 34 18" aria-hidden="true"><line x1="2" y1="9" x2="32" y2="9" class="link-path"/><line x1="15" y1="3" x2="15" y2="15" class="delay"/><line x1="19" y1="3" x2="19" y2="15" class="delay"/></svg>Delay</span>
        <span><svg viewBox="0 0 34 18" aria-hidden="true"><rect x="2" y="3" width="30" height="12" rx="6" class="exo-pill"/></svg>Outside driver</span>
        <span><svg viewBox="0 0 34 18" aria-hidden="true"><rect x="2" y="3" width="30" height="12" rx="2" class="decision-box"/></svg>Human decision</span>
        <span><b style="color:var(--reinf)">R</b> reinforcing loop &middot; <b style="color:var(--bal)">B</b> balancing loop</span>
      </div>
      <figcaption>Each box is something that piles up; each pipe is the rate that fills or drains it. Select a loop, box or variable to trace its mechanism and its sources.</figcaption>
    </figure>

    <aside>
      <section class="panel" id="detail" aria-live="polite"></section>
      <section>
        <h3 class="eyebrow" style="margin:0 0 8px">Feedback loops</h3>
        <div class="chips" id="chips"></div>
      </section>
    </aside>
  </div>

  <p class="foot">@@FOOT@@</p>
</div>

<script>
/*@@DATA@@*/
</script>
